---
# EVPN/VXLAN on Arista EOS: eBGP underlay + eBGP (multihop) overlay
#
# * Underlay: pure IPv6 -- IPv6-only loopbacks and p2p links, per-link eBGP IPv6 sessions
#             between leaf/exit and spine (EOS router-id comes from the router_id pool)
# * Overlay:  loopback-to-loopback eBGP multihop sessions (ebgp.multihop plugin),
#             EVPN AF activated only on those sessions, over IPv6 (IPv6 VTEPs)
# * Spines propagate EVPN routes without changing the next hop (see eos-evpn-nh-unchanged.j2)
#
defaults.device: eos
provider: libvirt
plugin: [ fabric, multilab, ebgp.multihop ]
defaults.multilab.id: 31
defaults.bgp.warnings.missing_igp: False        # Skip the "you probably need an IGP" warnings

vxlan.use_v6_vtep: True                          # IPv6 VTEPs (pure IPv6 underlay)
evpn.as: 65000                                   # Shared AS used for auto-generated RD/RT
evpn.session: [ ]                                # Do not activate EVPN AF on regular (underlay) BGP sessions

bgp:
  community.ebgp: [ standard, extended ]         # Propagate extended communities (RTs) over EBGP
  activate:
    ipv6: [ ebgp ]                               # Activate IPv6 unicast on EBGP sessions
  sessions:
    ipv6: [ ebgp ]                               # No IBGP sessions anymore
  multihop:
    activate:                                    # Address families on loopback-to-loopback EBGP sessions
      ipv6: [ evpn ]                             # EVPN over IPv6 multihop sessions
    sessions:                                    # Overlay sessions: every VTEP to every spine
    - blr-leaf01:
      blr-spine01:
    - blr-leaf01:
      blr-spine02:
    - blr-leaf02:
      blr-spine01:
    - blr-leaf02:
      blr-spine02:
    - blr-leaf03:
      blr-spine01:
    - blr-leaf03:
      blr-spine02:
    - blr-leaf04:
      blr-spine01:
    - blr-leaf04:
      blr-spine02:
    - blr-exit01:
      blr-spine01:
    - blr-exit01:
      blr-spine02:
    - blr-exit02:
      blr-spine01:
    - blr-exit02:
      blr-spine02:

# Underlay (loopbacks, fabric p2p links) is IPv6-only.
# Tenant VLANs, VRF loopbacks and the exit<->dcedge links (in VRF internet) stay dual-stack.
addressing:
  loopback:
    ipv4: False
    ipv6: 2001:db8:0::/48
  p2p:
    ipv4: False
    ipv6: 2001:db8:1::/48
  dcedge:                                        # exit <-> dcedge links (VRF internet), dual-stack
    ipv4: 10.1.0.0/16
    prefix: 30
    ipv6: 2001:db8:3::/48

groups:
  _auto_create: True
  leafs:
    members: [ blr-leaf01, blr-leaf02, blr-leaf03, blr-leaf04 ]
    module: [ bgp, vlan, vxlan, evpn, vrf, lag, gateway ]

  spines:
    members: [ blr-spine01, blr-spine02 ]
    module: [ bgp, evpn ]
    bgp.as: 65200
    config: [ eos-evpn-nh-unchanged.j2 ]

  exits:
    members: [ blr-exit01, blr-exit02 ]
    module: [ bgp, vxlan, vlan, vrf, evpn ]
    config: [ route-map.j2 ]
    vrfs:
      tenant:
        loopback: true
      internet:
        loopback: true

  dcedge:
    members: [ blr-dcedge01 ]
    module: [ bgp ]

  hosts:
    members: [ srv101, srv102, srv201, srv202 ]
    module: [ lag ]
    device: linux

vlan.mode: irb                                   # Enable routing between VLANs

vrfs:
  tenant:
    id: 50000
    evpn:
      transit_vni: 50000
    bgp: False

  internet:

vlans:
  red:
    vrf: tenant                                  # Assign to VRF
    prefix.ipv4: 172.16.10.0/24                   # IPv4 subnet
    prefix.ipv6: 2001:db8:10::/64
    gateway: true                                # Enable gateway on this VLAN

  blue:
    vrf: tenant                                  # Assign to VRF
    prefix.ipv4: 172.16.20.0/24                   # IPv4 subnet
    prefix.ipv6: 2001:db8:20::/64
    gateway: true                                # Enable gateway on this VLAN

  cyan:
    vrf: tenant                                  # Assign to VRF
    prefix.ipv4: 172.16.30.0/24                   # IPv4 subnet
    prefix.ipv6: 2001:db8:30::/64
    gateway: true                                # Enable gateway on this VLAN

# Per-node AS numbers (EBGP everywhere; multihop sessions need a node-level AS)
nodes:
  blr-leaf01.bgp.as: 65101
  blr-leaf02.bgp.as: 65102
  blr-leaf03.bgp.as: 65103
  blr-leaf04.bgp.as: 65104
  blr-exit01.bgp.as: 65111
  blr-exit02.bgp.as: 65112
  blr-dcedge01.bgp.as: 65534

links:

# Loopbacks for VTEP for leaves and exits
- blr-leaf01:
    type: loopback
    ipv4: False
    ipv6: 2001:db8:2::12/128
    vxlan.vtep: true
- blr-leaf02:
    type: loopback
    ipv4: False
    ipv6: 2001:db8:2::12/128
    vxlan.vtep: true
- blr-leaf03:
    type: loopback
    ipv4: False
    ipv6: 2001:db8:2::34/128
    vxlan.vtep: true
- blr-leaf04:
    type: loopback
    ipv4: False
    ipv6: 2001:db8:2::34/128
    vxlan.vtep: true

- blr-exit01:
    type: loopback
    ipv4: False
    ipv6: 2001:db8:2::101/128
    vxlan.vtep: true

- blr-exit02:
    type: loopback
    ipv4: False
    ipv6: 2001:db8:2::101/128
    vxlan.vtep: true

# Fabric links (underlay EBGP sessions; AS comes from nodes)
- blr-leaf01:
  blr-spine01:
- blr-leaf01:
  blr-spine02:
- blr-leaf02:
  blr-spine01:
- blr-leaf02:
  blr-spine02:
- blr-leaf03:
  blr-spine01:
- blr-leaf03:
  blr-spine02:
- blr-leaf04:
  blr-spine01:
- blr-leaf04:
  blr-spine02:
- blr-exit01:
  blr-spine01:
- blr-exit01:
  blr-spine02:
- blr-exit02:
  blr-spine01:
- blr-exit02:
  blr-spine02:

# Connection to DC edge
- blr-exit01:
    vrf: internet
    bgp.advertise: true
  blr-dcedge01:
  pool: dcedge

- blr-exit02:
    vrf: internet
    bgp.advertise: true
  blr-dcedge01:
  pool: dcedge

# MLAG peerlinks
- lag:
    members:
      - blr-leaf01: { ifname: eth3 }
        blr-leaf02: { ifname: eth3 }
    mlag.peergroup: true

- lag:
    members:
      - blr-leaf03: { ifname: eth3 }
        blr-leaf04: { ifname: eth3 }
    mlag.peergroup: true

- vlan: { access: red }
  lag:
    members:
      - srv101: {}
        blr-leaf01: {}
      - srv101: {}
        blr-leaf02: {}

- vlan: { access: blue }
  lag:
    members:
      - srv201: {}
        blr-leaf03: {}
      - srv201: {}
        blr-leaf04: {}
- vlan: { access: cyan }
  lag:
    members:
      - srv102: {}
        blr-leaf01: {}
      - srv102: {}
        blr-leaf02: {}
- vlan: { access: cyan }
  lag:
    members:
      - srv202: {}
        blr-leaf03: {}
      - srv202: {}
        blr-leaf04: {}
